<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="Requests from the internet reach the asg Application Load Balancer in two public subnets in us-east-2 on HTTP port 80, which forwards through its target group to the instances of the Auto Scaling group, one to six (desired four) t4g.micro Ubuntu 24.04 ARM64 instances in private subnets, launched from a launch template that installs Apache and serves a page of instance metadata. A CloudWatch alarm adds an instance when average CPU is above 60% for two minutes and another removes one when it stays below 60% for an hour. The instances reach the internet through a NAT gateway and carry an instance profile for SSM."><defs><marker id="a_e_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_tg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_lt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_scale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_nat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_ssm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs><rect width="1620" height="790" fill="#ffffff"/><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_http)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTP</text><path d="M810.0,350 V435" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_tg)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">target group</text><path d="M460,495.0 H595" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_lt)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">launches</text><path d="M1160,495.0 H1025" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_scale)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">+1 / -1</text><path d="M810.0,550 V635" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_nat)"/><text x="824.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">egress</text><path d="M250.0,640 V555" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_ssm)"/><text x="264.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">attached</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Browser / curl</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">from the internet</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#9a6700" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="664.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">asg-&lt;suffix&gt;-alb</text><text x="664.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">public subnets, HTTP 80, health /</text><rect x="600" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/><g transform="translate(620,480.0) scale(1.25)" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></g><text x="664.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">asg-&lt;suffix&gt;-main</text><text x="664.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">1-6 instances (desired 4), private</text><rect x="40" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(60,480.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="104.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Launch template</text><text x="104.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">Ubuntu 24.04 ARM64, t4g.micro, Apache</text><rect x="1160" y="440" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(1180,480.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="1224.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">CloudWatch alarms</text><text x="1224.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">cpu-high &gt; 60% (2 min), cpu-low &lt; 60% (1 h)</text><rect x="600" y="640" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,680.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g><text x="664.0" y="691.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">NAT gateway</text><text x="664.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">outbound for package installs</text><rect x="40" y="640" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/><g transform="translate(60,680.0) scale(1.25)" fill="none" stroke="#8250df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="104.0" y="691.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">SSM instance profile</text><text x="104.0" y="717.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">AmazonSSMManagedInstanceCore</text></svg>